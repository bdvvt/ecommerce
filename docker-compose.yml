version: '3.8'

services:
  identity-service:
    image: ${IMAGE_REGISTRY}/${IMAGE_PATH}:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    command: ["identity-service-0.0.1-SNAPSHOT.jar"]
    container_name: identity-service
    restart: unless-stopped
    networks:
      - micro-network
    ports:
      - "8081:8081"
    env_file:
      - .env
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - SERVER_PORT=8081
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/identity_db}
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      - NOTIFICATION_SERVICE_URL=http://notification-service:8087
      - CORS_ALLOWED_ORIGIN_PATTERNS=${CORS_ALLOWED_ORIGIN_PATTERNS:-*}

  notification-service:
    image: ${IMAGE_REGISTRY}/${IMAGE_PATH}:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    command: ["notification-service-0.0.1-SNAPSHOT.jar"]
    container_name: notification-service
    restart: unless-stopped
    networks:
      - micro-network
    ports:
      - "8087:8087"
    env_file:
      - .env
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - SERVER_PORT=8087
      - SPRING_DATA_MONGODB_URI=${SPRING_DATA_MONGODB_URI:-mongodb://mongodb:27017/notification_db}
      - SPRING_DATA_REDIS_HOST=${SPRING_DATA_REDIS_HOST:-redis}
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
    depends_on:
      - identity-service

  nginx-gateway:
    image: nginx:1.27-alpine
    container_name: nginx-ecommerce-gateway
    restart: unless-stopped
    networks:
      - micro-network
    ports:
      - "8000:8000"
    volumes:
      - ./microservice-gateway/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - identity-service
      - notification-service

networks:
  micro-network:
    name: micro-network
