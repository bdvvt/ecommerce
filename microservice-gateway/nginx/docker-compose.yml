version: "3.9"

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: nginx-ecommerce-gateway
    restart: unless-stopped

    ports:
      - "8000:8000"   # HTTP Gateway API proxy

    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_logs:/var/log/nginx

    networks:
      - micro-network

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  nginx_logs:

networks:
  micro-network:
    name: micro-network
