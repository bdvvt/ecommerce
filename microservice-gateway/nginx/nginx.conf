# ─────────────────────────────────────────────────────────────────────────────
#  Nginx API Gateway – Ecommerce Microservices
#  Routing Overview:
#    /api/v1/auth/**          → identity-service:8081  (Authentication / Register / Tokens)
#    /api/v1/users/**         → identity-service:8081  (User profile & management)
#    /api/v1/notifications/** → notification-service:8087 (Notification & Email)
#    /storage/**              → minio:9000 (MinIO Object Storage)
#    /swagger-ui/**           → identity-service:8081  (OpenAPI Documentation)
#    /v3/api-docs/**          → identity-service:8081
# ─────────────────────────────────────────────────────────────────────────────

worker_processes auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    keepalive_timeout 65;

    # ── Rate Limiting Zone ────────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=50r/s;

    # ── Upstream Backends ─────────────────────────────────────────────────────
    upstream identity_service {
        server identity-service:8081;
        keepalive 32;
    }

    upstream notification_service {
        server notification-service:8087;
        keepalive 16;
    }

    upstream minio_storage {
        server minio:9000;
        keepalive 16;
    }

    server {
        listen 8000;
        server_name _;

        # Hide Nginx version
        server_tokens off;

        # ── Global CORS Configuration ──────────────────────────────────────────
        set $cors_origin "";
        if ($http_origin ~* "^https?://(localhost|127\.0\.0\.1)(:[0-9]+)?$") {
            set $cors_origin $http_origin;
        }
        if ($cors_origin = "") {
            set $cors_origin "*";
        }

        add_header 'Access-Control-Allow-Origin'      '$cors_origin'                     always;
        add_header 'Access-Control-Allow-Credentials' 'true'                             always;
        add_header 'Access-Control-Allow-Methods'     'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers'     'Accept, Authorization, Content-Type, Origin, X-Requested-With' always;
        add_header 'Access-Control-Expose-Headers'    'Authorization, Content-Disposition' always;
        add_header 'Access-Control-Max-Age'           '3600'                             always;

        # Preflight OPTIONS handler
        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # Global Request rate limiting
        limit_req zone=api_limit burst=25 nodelay;

        # File upload size limit
        client_max_body_size 50m;

        # ══════════════════════════════════════════════════════════════════════
        # ROUTE 1: Identity Service – Auth API
        #   /api/v1/auth/** → identity-service:8081
        # ══════════════════════════════════════════════════════════════════════
        location ^~ /api/v1/auth {
            proxy_pass         http://identity_service;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_read_timeout 60s;
        }

        # ══════════════════════════════════════════════════════════════════════
        # ROUTE 2: Identity Service – Users API
        #   /api/v1/users/**      → identity-service:8081
        #   /api/users/**         → identity-service:8081
        # ══════════════════════════════════════════════════════════════════════
        location ^~ /api/v1/users {
            proxy_pass         http://identity_service;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_read_timeout 60s;
        }

        location ^~ /api/users {
            proxy_pass         http://identity_service;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_read_timeout 60s;
        }

        location ^~ /api/v1/permissions {
            proxy_pass         http://identity_service;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_read_timeout 60s;
        }

        location ^~ /api/v1/admin/permissions {
            proxy_pass         http://identity_service;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_read_timeout 60s;
        }

        location ^~ /api/v1/roles {
            proxy_pass         http://identity_service;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_read_timeout 60s;
        }

        location ^~ /api/v1/admin/roles {
            proxy_pass         http://identity_service;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_read_timeout 60s;
        }

        # ══════════════════════════════════════════════════════════════════════
        # ROUTE 3: Notification Service
        #   /api/v1/notifications/** → notification-service:8087
        # ══════════════════════════════════════════════════════════════════════
        location ^~ /api/v1/notifications {
            proxy_pass         http://notification_service;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_read_timeout 60s;
        }

        # ══════════════════════════════════════════════════════════════════════
        # ROUTE 4: MinIO Storage Proxy
        #   /storage/** → minio:9000
        # ══════════════════════════════════════════════════════════════════════
        location ^~ /storage/ {
            proxy_pass         http://minio_storage/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            client_max_body_size 100m;
        }

        # ══════════════════════════════════════════════════════════════════════
        # ROUTE 5: Swagger / OpenAPI Documentation
        # ══════════════════════════════════════════════════════════════════════
        location ^~ /swagger-ui {
            proxy_pass         http://identity_service;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
        }

        location ^~ /v3/api-docs {
            proxy_pass         http://identity_service;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
        }

        # ── Health check endpoint ──────────────────────────────────────────
        location /health {
            access_log off;
            return 200 '{"status":"UP","gateway":"nginx-ecommerce"}';
            add_header Content-Type application/json;
        }

        # ── Fallback ───────────────────────────────────────────────────────
        location / {
            return 404 '{"error":"Route not found in Ecommerce Gateway"}';
            add_header Content-Type application/json;
        }
    }
}
